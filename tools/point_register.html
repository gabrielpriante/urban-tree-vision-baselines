<!doctype html> <!-- Declare this file as an HTML5 document. -->
<html lang="en"> <!-- Begin the English-language webpage. -->
<head> <!-- Begin the page metadata section. -->
<meta charset="utf-8"> <!-- Use UTF-8 character encoding. -->
<meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Make the page scale correctly in the browser. -->
<title>Field Point Registration</title> <!-- Set a scene-neutral browser tab title. -->
<style> /* Begin the page styling rules. */
body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; } /* Give the page a simple readable layout. */
h1 { margin-bottom: 8px; } /* Keep the title visually close to the explanatory text. */
.note { max-width: 950px; line-height: 1.5; } /* Keep the methodological note readable on wide screens. */
.controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 16px 0; } /* Arrange the scene, image, zoom, registration, and export controls in a compact row. */
.status { font-weight: bold; margin: 12px 0; } /* Make the current registration instruction easy to see. */
.viewer { width: 100%; height: 72vh; overflow: auto; background: #222; border: 1px solid #999; } /* Create a scrollable workspace for the high-resolution aerial image. */
canvas { display: block; cursor: crosshair; } /* Display the aerial image as a clickable canvas with a crosshair pointer. */
input, select, button { font-size: 14px; padding: 6px 10px; } /* Keep all browser controls easy to read and use. */
</style> <!-- Finish the page styling rules. -->
</head> <!-- Finish the page metadata section. -->
<body> <!-- Begin the visible page content. -->
<h1>Field Point Registration</h1> <!-- Display the generalized utility name. -->
<p class="note">Register field-informed tree locations onto standardized aerial imagery using one interior crown point per tree.</p> <!-- State the generalized purpose of the B3 registration utility. -->
<p class="note">Registered points must be frozen before SAM2 inference and must not be moved based on later SAM2 output.</p> <!-- Preserve the anti-tuning rule directly in the interface. -->
<div class="controls"> <!-- Begin the scene and registration controls. -->
<label>Scene <select id="sceneInput"><option value="PT_R1">PT_R1</option><option value="PT_02">PT_02</option></select></label> <!-- Let the user select the study scene before registering any image points. -->
<label>Condition <select id="conditionInput"><option value="before">BEFORE</option><option value="after">AFTER</option></select></label> <!-- Record whether the selected standardized image belongs to the BEFORE or AFTER condition. -->
<label>Image <input id="imageInput" type="file" accept="image/*"></label> <!-- Let the user choose the standardized image from the local computer. -->
<label>Zoom <input id="zoomInput" type="range" min="10" max="100" value="25" step="5"></label> <!-- Let the user change only the displayed image size while preserving native pixel coordinates. -->
<span id="zoomValue">25%</span> <!-- Display the current zoom percentage beside the slider. -->
<button id="undoButton" type="button">Undo last point</button> <!-- Let the user remove the most recently registered tree point. -->
<button id="resetButton" type="button">Reset all</button> <!-- Let the user clear the complete current registration and restart the active scene sequence. -->
<button id="csvButton" type="button">Export CSV</button> <!-- Let the user export the completed native-image point coordinates as a structured B3 input artifact. -->
<button id="pngButton" type="button">Export labeled PNG</button> <!-- Let the user export a full-resolution visual record of the completed point registration. -->
</div> <!-- Finish the scene and registration controls. -->
<div id="status" class="status">Load an image to begin.</div> <!-- Display the next required registration ID and current progress. -->
<div class="viewer"> <!-- Begin the scrollable image workspace. -->
<canvas id="canvas"></canvas> <!-- Create the native-resolution drawing surface used for the aerial image and registered points. -->
</div> <!-- Finish the scrollable image workspace. -->
<script> // Begin the browser-side registration and export logic.
const sceneIds = { PT_R1: [3, 4, 5, 6, 7, 8, 9, 10, 11], PT_02: Array.from({ length: 22 }, (_, index) => `A${String(index + 1).padStart(2, "0")}`) }; // Freeze the PT_R1 physical tree IDs and create neutral A01 through A22 registration IDs for the lower-certainty PT_02 alleyway scene.
const sceneMethods = { PT_R1: "manual_field_confirmed_registration", PT_02: "manual_field_count_constrained_registration" }; // Distinguish the high-certainty PT_R1 registration method from the lower-spatial-certainty PT_02 field-count-constrained method.
const sceneInput = document.getElementById("sceneInput"); // Get the study-scene selector used to determine the active registration sequence.
const conditionInput = document.getElementById("conditionInput"); // Get the BEFORE or AFTER condition selector used for exported provenance.
const imageInput = document.getElementById("imageInput"); // Get the local aerial-image file selector.
const zoomInput = document.getElementById("zoomInput"); // Get the display zoom slider.
const zoomValue = document.getElementById("zoomValue"); // Get the visible zoom-percentage label.
const undoButton = document.getElementById("undoButton"); // Get the button used to remove the latest registered point.
const resetButton = document.getElementById("resetButton"); // Get the button used to clear all registered points.
const csvButton = document.getElementById("csvButton"); // Get the button used to export the completed registration as CSV.
const pngButton = document.getElementById("pngButton"); // Get the button used to export the labeled full-resolution preview.
const statusText = document.getElementById("status"); // Get the status area used to show registration progress.
const canvas = document.getElementById("canvas"); // Get the native-resolution aerial-image canvas.
const context = canvas.getContext("2d"); // Create the two-dimensional drawing context for the image and point labels.
const image = new Image(); // Create a browser image object that will hold the selected standardized image.
let imageFilename = ""; // Preserve the original selected image filename for exported provenance.
let points = []; // Store the manually registered native-image pixel coordinates in active-scene registration order.
function activeIds() { // Define a helper that returns the required registration identifiers for the selected scene.
    return sceneIds[sceneInput.value]; // Return either PT_R1 Trees 3 through 11 or PT_02 neutral IDs A01 through A22.
} // Finish the active-registration-ID helper.
function updateZoom() { // Define how the displayed image scale changes without modifying native coordinates.
    const zoomPercent = Number(zoomInput.value); // Read the current zoom percentage from the slider.
    zoomValue.textContent = `${zoomPercent}%`; // Update the visible zoom-percentage label.
    if (!image.naturalWidth) return; // Stop if no aerial image has been loaded yet.
    canvas.style.width = `${image.naturalWidth * zoomPercent / 100}px`; // Scale only the displayed canvas width while retaining native canvas pixels.
    canvas.style.height = `${image.naturalHeight * zoomPercent / 100}px`; // Scale only the displayed canvas height while retaining native canvas pixels.
} // Finish the display-zoom function.
function updateStatus() { // Define how the page reports registration progress.
    const ids = activeIds(); // Read the required registration identifiers for the currently selected scene.
    if (!image.naturalWidth) { // Check whether an aerial image has been loaded.
        statusText.textContent = `Load a ${sceneInput.value} image to begin.`; // Ask the user to load an image associated with the selected scene.
        return; // Stop because point registration cannot begin without an image.
    } // Finish the no-image condition.
    if (points.length === ids.length) { // Check whether every required registration point has been completed.
        statusText.textContent = `All ${ids.length} ${sceneInput.value} locations registered. Review carefully, then export the CSV and labeled PNG.`; // Report that the active scene registration is complete.
        return; // Stop because there is no additional location to register.
    } // Finish the completed-registration condition.
    const nextId = ids[points.length]; // Determine which registration identifier must receive the next click.
    statusText.textContent = `Next click: ${nextId} | Registered ${points.length} of ${ids.length}`; // Display the exact next registration identifier and current progress.
} // Finish the registration-status function.
function draw() { // Define how the untouched aerial image and current point registrations are rendered.
    if (!image.naturalWidth) return; // Stop if no aerial image has been loaded yet.
    canvas.width = image.naturalWidth; // Keep the drawing canvas at the exact native image width.
    canvas.height = image.naturalHeight; // Keep the drawing canvas at the exact native image height.
    context.drawImage(image, 0, 0); // Draw the untouched aerial image onto the native-resolution canvas.
    points.forEach((point) => { // Draw every currently registered field-informed tree point.
        context.beginPath(); // Begin the circular point-marker geometry.
        context.arc(point.x, point.y, 36, 0, Math.PI * 2); // Draw a visible circle centered on the exact native-image pixel coordinate.
        context.fillStyle = "red"; // Use red for the interior of the point marker.
        context.fill(); // Fill the circular point marker.
        context.lineWidth = 8; // Use a thick marker outline so the point remains visible over vegetation.
        context.strokeStyle = "white"; // Use white around the marker to separate it from dark canopy.
        context.stroke(); // Draw the white outline around the point marker.
        context.font = "bold 60px Arial"; // Use a large native-resolution font for the registration label.
        context.lineWidth = 10; // Use a thick text outline so the registration ID remains readable over complex imagery.
        context.strokeStyle = "white"; // Use white around the text for contrast against vegetation.
        context.strokeText(String(point.registration_id), point.x + 52, point.y - 24); // Draw the outlined registration ID beside its exact point.
        context.fillStyle = "red"; // Use red for the interior of the registration label.
        context.fillText(String(point.registration_id), point.x + 52, point.y - 24); // Draw the registration ID beside its exact point.
    }); // Finish drawing all current field-point registrations.
    updateZoom(); // Reapply the selected display scale after redrawing the native-resolution canvas.
    updateStatus(); // Refresh the next-registration instruction after every redraw.
} // Finish the image-and-registration drawing function.
function registrationComplete() { // Define a reusable check for whether the active scene registration is complete.
    return image.naturalWidth && points.length === activeIds().length; // Require a loaded image and exactly the expected number of registrations for the selected scene.
} // Finish the completed-registration check.
function resetRegistration() { // Define a reusable reset for any change that invalidates the active coordinate sequence.
    points = []; // Remove every currently registered point.
    if (image.naturalWidth) draw(); // Redraw the loaded image without any registrations if an image is currently available.
    else updateStatus(); // Otherwise refresh the text instruction for the newly selected scene.
} // Finish the reusable registration-reset function.
sceneInput.addEventListener("change", resetRegistration); // Clear registrations whenever the study scene changes so PT_R1 and PT_02 points cannot be mixed.
conditionInput.addEventListener("change", resetRegistration); // Clear registrations whenever BEFORE or AFTER changes so conditions cannot be mixed accidentally.
imageInput.addEventListener("change", () => { // Respond whenever the user selects a local aerial image.
    const file = imageInput.files[0]; // Read the single selected aerial-image file.
    if (!file) return; // Stop if the file-selection dialog was canceled.
    imageFilename = file.name; // Preserve the selected image filename for CSV provenance.
    points = []; // Reset all existing point registrations because a new image defines a new coordinate space.
    const objectUrl = URL.createObjectURL(file); // Create a temporary browser-local URL without uploading the selected image anywhere.
    image.onload = () => { // Define what happens after the selected aerial image finishes loading.
        URL.revokeObjectURL(objectUrl); // Release the temporary browser-local image URL after loading completes.
        draw(); // Draw the native-resolution aerial image with an empty registration set.
    }; // Finish the image-loaded behavior.
    image.src = objectUrl; // Load the selected local aerial image into the browser image object.
}); // Finish the aerial-image selection handler.
canvas.addEventListener("click", (event) => { // Register the next field-informed tree location whenever the aerial image is clicked.
    const ids = activeIds(); // Read the currently required registration identifiers.
    if (!image.naturalWidth) return; // Ignore clicks until an aerial image has been loaded.
    if (points.length >= ids.length) return; // Ignore extra clicks after the active scene registration is complete.
    const rectangle = canvas.getBoundingClientRect(); // Measure the displayed canvas position and dimensions in browser coordinates.
    const nativeX = Math.round((event.clientX - rectangle.left) * canvas.width / rectangle.width); // Convert the displayed click x position into the exact native-image x pixel coordinate.
    const nativeY = Math.round((event.clientY - rectangle.top) * canvas.height / rectangle.height); // Convert the displayed click y position into the exact native-image y pixel coordinate.
    const registrationId = ids[points.length]; // Assign the next required scene-specific registration identifier to this click.
    points.push({ registration_id: registrationId, x: nativeX, y: nativeY }); // Store the registration ID and exact native-image coordinate in click order.
    draw(); // Redraw the image so the newly registered point and label become visible immediately.
}); // Finish the image-click registration handler.
zoomInput.addEventListener("input", updateZoom); // Update only the displayed image scale whenever the zoom slider changes.
undoButton.addEventListener("click", () => { // Respond when the user intentionally removes the most recent registration.
    if (points.length === 0) return; // Do nothing if there are no registered points to remove.
    points.pop(); // Remove only the most recently registered field-informed location.
    draw(); // Redraw the image and return the workflow to that registration ID.
}); // Finish the undo handler.
resetButton.addEventListener("click", resetRegistration); // Clear every current registration and restart the active scene sequence from its first ID.
csvButton.addEventListener("click", () => { // Respond when the user requests the structured B3 coordinate artifact.
    if (!registrationComplete()) { // Check whether every required active-scene point has been registered.
        alert(`Register all ${activeIds().length} required locations before exporting the CSV.`); // Prevent an incomplete prompt set from being exported accidentally.
        return; // Stop the export because the registration is incomplete.
    } // Finish the incomplete-registration check.
    const scene = sceneInput.value; // Read the selected study scene for provenance.
    const condition = conditionInput.value; // Read the selected BEFORE or AFTER condition for provenance.
    const method = sceneMethods[scene]; // Read the frozen registration-method label associated with the selected scene.
    const header = "registration_id,condition,image_stem,image_filename,native_width,native_height,x,y,registration_method\n"; // Define the generalized CSV schema used by later field-guided inference.
    const rows = points.map((point) => `${point.registration_id},${condition},${scene},${imageFilename},${image.naturalWidth},${image.naturalHeight},${point.x},${point.y},${method}`).join("\n"); // Serialize every scene-specific registration point and its exact native-image coordinate.
    const csvText = header + rows + "\n"; // Combine the stable CSV header and all completed registration records into one artifact.
    const blob = new Blob([csvText], { type: "text/csv;charset=utf-8" }); // Create the CSV entirely inside the browser without uploading research data anywhere.
    const objectUrl = URL.createObjectURL(blob); // Create a temporary browser-local URL for the generated CSV artifact.
    const link = document.createElement("a"); // Create a temporary browser download link used only for this export.
    link.href = objectUrl; // Attach the generated CSV file to the temporary download link.
    link.download = `${scene}_${condition}_field_points.csv`; // Give the coordinate artifact a deterministic scene-and-condition-specific filename.
    link.click(); // Start the browser download of the completed registration CSV.
    URL.revokeObjectURL(objectUrl); // Release the temporary CSV object URL after the browser begins the download.
}); // Finish the generalized CSV export handler.
pngButton.addEventListener("click", () => { // Respond when the user requests the labeled visual registration artifact.
    if (!registrationComplete()) { // Check whether every required active-scene point has been registered.
        alert(`Register all ${activeIds().length} required locations before exporting the labeled PNG.`); // Prevent an incomplete visual registration record from being exported accidentally.
        return; // Stop the export because the registration is incomplete.
    } // Finish the incomplete-registration check.
    const scene = sceneInput.value; // Read the selected scene for the deterministic output filename.
    const condition = conditionInput.value; // Read the selected condition for the deterministic output filename.
    const link = document.createElement("a"); // Create a temporary browser download link used only for this labeled PNG export.
    link.href = canvas.toDataURL("image/png"); // Encode the native-resolution aerial image and visible registration labels into a PNG entirely inside the browser.
    link.download = `${scene}_${condition}_field_points_preview.png`; // Give the visual registration artifact a deterministic scene-and-condition-specific filename.
    link.click(); // Start the browser download of the full-resolution labeled registration preview.
}); // Finish the generalized labeled PNG export handler.
updateStatus(); // Initialize the interface with the correct selected-scene instruction before an image is loaded.
</script> <!-- Finish the browser-side registration and export logic. -->
</body> <!-- Finish the visible page content. -->
</html> <!-- Finish the HTML document. -->
